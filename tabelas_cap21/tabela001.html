<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML</title>
    <link rel="stylesheet" href="styel.css">
</head>
<body>
    <!--Cabeçalho da tabela
    <table> = TABLE é a tag para criar a tabela
    <th> = TABLE HEADER é a tag para criar o cabeçalho da tabela
    <tr> =TABLE ROW é a tag para criar a linha da tabela
    <td> = Table data = Dado de tabela-->
    <h1>Tabelas em HTML</h1>
    <table>
        <tr class="linha-par">
            <td>Nome</td>
            <td>Idade</td>
            <td>Cidade</td>
        </tr>
        <tr class="linha-impar">
            <td>João</td>
            <td class="numero">20</td>
            <td>São Paulo</td>
        </tr>
        <tr class="linha-par">
            <td>Maria</td>
            <td class="numero">21</td>
            <td>Rio de Janeiro</td>
        </tr>
        <tr class="linha-impar">
            <td>Pedro</td>
            <td class="numero">22</td>
            <td>Belo Horizonte</td>
        </tr>
        <tr class="linha-par">
            <td>Ana</td>
            <td class="numero">23</td>
            <td>Curitiba</td>
        </tr>
    </table>
</body>
</html>
